# 每天拿 npm 上 DSH 的三个通道（正式版 latest / 下一版 next / 尝鲜版 alpha）各测一遍本插件：
#   1. 对照真实 DSH 代码的测试（test/dsh-real.test.js）
#   2. 真的装上插件、启动网页版，逐项检查（scripts/compat-smoke.mjs）
# 某个通道测不过就自动开一个问题单（同一个版本只开一个，后续失败追加评论）；恢复后自动关掉。
# 推送代码和 PR 时也会跑，外加全部单元测试。
name: DSH 兼容性检查

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 */6 * * *' # 每 6 小时一次：DSH 发了新版，最迟 6 小时内就知道
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  unit:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  compat:
    name: DSH ${{ matrix.channel }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        channel: [latest, next, alpha]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # dsh plugin add 会调用系统里的 pnpm
      - run: npm install -g pnpm@11
      - run: npm ci

      - name: 查 DSH 在这个通道的版本
        id: ver
        run: |
          v="$(npm view @deepseek-ai/dsh dist-tags.${{ matrix.channel }})"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "DSH ${{ matrix.channel }} = $v" >> "$GITHUB_STEP_SUMMARY"

      - name: 安装 DSH ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/dsh" && cd "$RUNNER_TEMP/dsh"
          echo '{"private":true}' > package.json
          npm install --no-audit --no-fund "@deepseek-ai/dsh@${{ steps.ver.outputs.version }}"

      - name: 打包插件
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: 对照真实 DSH 代码的测试
        env:
          DSH_MODULES: ${{ runner.temp }}/dsh/node_modules
        run: node --test test/dsh-real.test.js

      - name: 装上插件、启动网页版逐项检查
        env:
          COMPAT_REPORT: ${{ runner.temp }}/report.json
        run: node scripts/compat-smoke.mjs --dsh "$RUNNER_TEMP/dsh/node_modules" --plugin "$(ls "$RUNNER_TEMP"/dsh-vps-manager-*.tgz)"

      - name: 失败时开问题单 / 恢复后关掉
        if: always() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        env:
          CHANNEL: ${{ matrix.channel }}
          VERSION: ${{ steps.ver.outputs.version }}
          REPORT: ${{ runner.temp }}/report.json
          JOB_OK: ${{ job.status == 'success' }}
        with:
          script: |
            const fs = require('fs')
            const { CHANNEL, VERSION, REPORT, JOB_OK } = process.env
            const label = 'dsh-compat'
            const prefix = `DSH ${CHANNEL} 通道兼容性检查失败`
            const title = `${prefix}：${VERSION}`
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: label, per_page: 100,
            })
            const mine = open.filter((i) => i.title.startsWith(prefix))

            if (JOB_OK === 'true') {
              for (const issue of mine) {
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                  body: `已恢复：DSH ${CHANNEL} ${VERSION} 这一轮全部通过（${run}）。自动关闭。` })
                await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed' })
              }
              return
            }

            let report = null
            try { report = JSON.parse(fs.readFileSync(REPORT, 'utf8')) } catch {}
            const failed = report ? report.checks.filter((c) => !c.ok) : []
            const lines = [
              `DSH **${CHANNEL}** 通道的 **${VERSION}** 下，本插件的兼容性检查没通过。`,
              '',
              `- 插件提交：${context.sha.slice(0, 7)}`,
              `- 运行记录：${run}`,
              '',
              failed.length ? '### 没通过的项' : '### 没通过的步骤',
              ...(failed.length ? failed.map((c) => `- ${c.name}${c.detail ? `：${c.detail}` : ''}`) : ['- 检查脚本之前的步骤就失败了（安装 DSH、打包或对照测试），详见运行记录']),
            ]
            if (report?.logTail) lines.push('', '<details><summary>DSH 日志末尾</summary>', '', '```text', report.logTail.slice(-2500), '```', '</details>')
            const body = lines.join('\n')
            const same = mine.find((i) => i.title === title)
            if (same) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: same.number, body })
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: [label] })
            }
