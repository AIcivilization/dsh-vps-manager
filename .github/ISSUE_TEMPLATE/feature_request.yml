name: 建议 / Suggestion
description: 想要的新功能或改进 · A feature or improvement you'd like
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: 想要什么 / What you'd like
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 用在什么场景 / What you'd use it for
      description: 说说你想解决的事，比具体做法更有用 · The problem you're solving helps more than a specific design
  - type: textarea
    id: alternatives
    attributes:
      label: 现在怎么凑合 / How you manage today
