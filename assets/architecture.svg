<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="dsh-vps-manager 工作方式：DSH 界面和模型都通过插件，经 OpenSSH 密钥登录连到你的 VPS">
  <title>dsh-vps-manager 工作方式</title>
  <desc>DSH 界面（对话头部开关、终端、设置页）经插件路由和实时连接、DSH 里的模型经工具调用，都进入 dsh-vps-manager 插件；插件做风险判定与确认，再通过 OpenSSH（密钥登录、连接复用）连到你的 VPS，在服务器上跑远端任务、备份文件、设连通性保险。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 浅色底板：GitHub 深色模式下也看得清 -->
  <rect x="0" y="0" width="760" height="300" rx="14" fill="#FBFAF7"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', Helvetica, Arial, sans-serif">

    <!-- 左：两个入口 -->
    <rect x="24" y="44" width="164" height="76" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="106" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">DSH 界面</text>
    <text x="106" y="89" text-anchor="middle" font-size="11" fill="#5F5E5A">头部开关 · 终端</text>
    <text x="106" y="105" text-anchor="middle" font-size="11" fill="#5F5E5A">设置页 · /vps- 命令</text>

    <rect x="24" y="170" width="164" height="76" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="106" y="196" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">DSH 里的模型</text>
    <text x="106" y="215" text-anchor="middle" font-size="11" fill="#534AB7">你说一句话</text>
    <text x="106" y="231" text-anchor="middle" font-size="11" fill="#534AB7">它调用 5 个 VPS 工具</text>

    <!-- 中：插件 -->
    <rect x="252" y="80" width="200" height="130" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
    <text x="352" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#0C447C">dsh-vps-manager</text>
    <text x="352" y="132" text-anchor="middle" font-size="11" fill="#185FA5">风险判定 · 分级确认</text>
    <text x="352" y="150" text-anchor="middle" font-size="11" fill="#185FA5">菜谱 · 审计日志</text>
    <text x="352" y="168" text-anchor="middle" font-size="11" fill="#185FA5">连接状态检测</text>
    <text x="352" y="186" text-anchor="middle" font-size="11" fill="#185FA5">终端会话（断线保留）</text>

    <path d="M192 82 C222 82 226 118 248 122" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="232" y="64" text-anchor="middle" font-size="10" fill="#5F5E5A">路由 · WebSocket</text>
    <path d="M192 208 C222 208 226 172 248 168" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="214" y="232" text-anchor="middle" font-size="10" fill="#5F5E5A">工具调用</text>

    <!-- 中右：OpenSSH -->
    <rect x="500" y="104" width="104" height="82" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="552" y="132" text-anchor="middle" font-size="14" font-weight="600" fill="#412402">OpenSSH</text>
    <text x="552" y="151" text-anchor="middle" font-size="11" fill="#854F0B">密钥登录</text>
    <text x="552" y="168" text-anchor="middle" font-size="11" fill="#854F0B">连接复用</text>

    <path d="M456 145 L496 145" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="476" y="136" text-anchor="middle" font-size="10" fill="#5F5E5A">子进程</text>

    <!-- 右：服务器 -->
    <rect x="648" y="70" width="92" height="150" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="694" y="98" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">你的 VPS</text>
    <text x="694" y="124" text-anchor="middle" font-size="11" fill="#0F6E56">远端任务</text>
    <text x="694" y="142" text-anchor="middle" font-size="11" fill="#0F6E56">文件备份</text>
    <text x="694" y="160" text-anchor="middle" font-size="11" fill="#0F6E56">连通性保险</text>
    <text x="694" y="178" text-anchor="middle" font-size="11" fill="#0F6E56">伪终端</text>
    <text x="694" y="196" text-anchor="middle" font-size="10" fill="#0F6E56">~/.cache/dsh-vps</text>

    <path d="M608 145 L644 145" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="626" y="136" text-anchor="middle" font-size="10" fill="#5F5E5A">SSH</text>

    <!-- 底部说明 -->
    <text x="380" y="282" text-anchor="middle" font-size="11" fill="#5F5E5A">命令不走模型、不花 token；模型的每次操作都先经插件判定风险，改动类按你设的档位确认</text>
  </g>
</svg>
