<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="How dsh-vps-manager works: the DSH interface and the model both go through the plugin, which reaches your VPS over OpenSSH key login">
  <title>How dsh-vps-manager works</title>
  <desc>The DSH interface (header switch, terminal, settings page) reaches the plugin through its routes and a WebSocket; the model in DSH reaches it through tool calls. The plugin classifies risk and asks for confirmation, then connects to your VPS over OpenSSH (key login, shared connections) to run remote tasks, back up files and set a connectivity safety net.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- light backdrop so it stays readable in GitHub dark mode -->
  <rect x="0" y="0" width="760" height="300" rx="14" fill="#FBFAF7"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', Helvetica, Arial, sans-serif">

    <!-- 左：两个入口 -->
    <rect x="24" y="44" width="164" height="76" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="106" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">DSH interface</text>
    <text x="106" y="89" text-anchor="middle" font-size="11" fill="#5F5E5A">Header switch · terminal</text>
    <text x="106" y="105" text-anchor="middle" font-size="11" fill="#5F5E5A">Settings · /vps- commands</text>

    <rect x="24" y="170" width="164" height="76" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="106" y="196" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">The model in DSH</text>
    <text x="106" y="215" text-anchor="middle" font-size="11" fill="#534AB7">You ask in plain words</text>
    <text x="106" y="231" text-anchor="middle" font-size="11" fill="#534AB7">it calls 5 VPS tools</text>

    <!-- 中：插件 -->
    <rect x="252" y="80" width="200" height="130" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
    <text x="352" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#0C447C">dsh-vps-manager</text>
    <text x="352" y="132" text-anchor="middle" font-size="11" fill="#185FA5">Risk levels · confirmation</text>
    <text x="352" y="150" text-anchor="middle" font-size="11" fill="#185FA5">Recipes · audit log</text>
    <text x="352" y="168" text-anchor="middle" font-size="11" fill="#185FA5">Connection checks</text>
    <text x="352" y="186" text-anchor="middle" font-size="11" fill="#185FA5">Terminal sessions (kept)</text>

    <path d="M192 82 C222 82 226 118 248 122" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="232" y="64" text-anchor="middle" font-size="10" fill="#5F5E5A">Routes · WebSocket</text>
    <path d="M192 208 C222 208 226 172 248 168" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="214" y="232" text-anchor="middle" font-size="10" fill="#5F5E5A">Tool calls</text>

    <!-- 中右：OpenSSH -->
    <rect x="500" y="104" width="104" height="82" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="552" y="132" text-anchor="middle" font-size="14" font-weight="600" fill="#412402">OpenSSH</text>
    <text x="552" y="151" text-anchor="middle" font-size="11" fill="#854F0B">Key login</text>
    <text x="552" y="168" text-anchor="middle" font-size="11" fill="#854F0B">Multiplexed</text>

    <path d="M456 145 L496 145" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="476" y="136" text-anchor="middle" font-size="10" fill="#5F5E5A">spawns</text>

    <!-- 右：服务器 -->
    <rect x="648" y="70" width="92" height="150" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="694" y="98" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">Your VPS</text>
    <text x="694" y="124" text-anchor="middle" font-size="11" fill="#0F6E56">Remote tasks</text>
    <text x="694" y="142" text-anchor="middle" font-size="11" fill="#0F6E56">File backups</text>
    <text x="694" y="160" text-anchor="middle" font-size="11" fill="#0F6E56">Safety net</text>
    <text x="694" y="178" text-anchor="middle" font-size="11" fill="#0F6E56">Pseudo-terminal</text>
    <text x="694" y="196" text-anchor="middle" font-size="10" fill="#0F6E56">~/.cache/dsh-vps</text>

    <path d="M608 145 L644 145" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="626" y="136" text-anchor="middle" font-size="10" fill="#5F5E5A">SSH</text>

    <!-- 底部说明 -->
    <text x="380" y="282" text-anchor="middle" font-size="11" fill="#5F5E5A">Commands never touch the model or spend tokens; every model action is risk-checked by the plugin and confirmed per your settings</text>
  </g>
</svg>
